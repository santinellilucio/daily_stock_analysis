name: NetDiag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: test gateway
        env:
          K: ${{ secrets.ANSPIRE_API_KEYS }}
        run: |
          echo "--- DNS ---"
          getent hosts open-gateway.anspire.cn || echo dns_fail
          echo "--- /models latency ---"
          curl -sS -o /dev/null -w "http=%{http_code} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n" --max-time 60 -H "Authorization: Bearer $K" https://open-gateway.anspire.cn/v6/models || echo "curl_failed_$?"
          echo "--- chat completion ---"
          curl -sS -o /tmp/out.json -w "http=%{http_code} total=%{time_total}\n" --max-time 90 -X POST https://open-gateway.anspire.cn/v6/chat/completions -H "Authorization: Bearer $K" -H "Content-Type: application/json" -d '{"model":"deepseek-v4.1-Flash","messages":[{"role":"user","content":"say hi"}],"stream":false}' || echo "curl_failed_$?"
          head -c 300 /tmp/out.json || true
